<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Negocios Internacionales – Práctica</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#5b6478; --border:#dfe4ee;
    --primary:#3b5bdb; --primary-soft:#e7ecff;
    --ok:#1f9d55; --ok-bg:#e6f6ec; --bad:#d64545; --bad-bg:#fdeaea;
    --shadow:0 2px 10px rgba(20,30,60,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#10141f; --card:#1a2030; --text:#e8ecf5; --muted:#9aa4bb; --border:#2b3350;
      --primary:#7b93ff; --primary-soft:#232b4a;
      --ok:#4cc38a; --ok-bg:#15301f; --bad:#ff7b7b; --bad-bg:#3a1c1f;
      --shadow:none;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  header{padding:28px 16px 8px;text-align:center}
  header h1{margin:0;font-size:clamp(1.3rem,4vw,1.9rem)}
  header p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
  main{max-width:820px;margin:0 auto;padding:0 16px 48px}

  nav{display:flex;gap:8px;overflow-x:auto;padding:16px 0;scrollbar-width:thin}
  nav button{flex:0 0 auto;border:1px solid var(--border);background:var(--card);color:var(--text);
    padding:10px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
  nav button:hover{border-color:var(--primary)}
  nav button.active{background:var(--primary);border-color:var(--primary);color:#fff}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
  .score{font-weight:600;color:var(--muted)}
  .score b{color:var(--text)}
  .actions{display:flex;gap:8px}
  .btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 14px;
    border-radius:8px;font:inherit;cursor:pointer}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .bar{height:6px;background:var(--border);border-radius:9px;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}

  .block-title{margin:26px 0 10px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);font-weight:700}
  .q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
  .q h3{margin:0 0 4px;font-size:1.02rem}
  .tag{display:inline-block;font-size:.72rem;background:var(--primary-soft);color:var(--primary);
    padding:2px 9px;border-radius:999px;margin-bottom:8px;font-weight:600}
  .opts{display:grid;gap:10px;margin-top:12px}
  .opt{display:flex;gap:12px;text-align:left;width:100%;border:2px solid var(--border);background:transparent;
    color:var(--text);padding:12px 14px;border-radius:10px;font:inherit;cursor:pointer;transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
  .opt .l{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
    display:grid;place-items:center;font-weight:700;font-size:.85rem}
  .opt:disabled{cursor:default}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .l{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .l{background:var(--bad);color:#fff}
  .opt.dim{opacity:.6}
  .just{margin-top:14px;padding:12px 14px;border-radius:10px;border-left:4px solid var(--ok);background:var(--ok-bg);font-size:.95rem}
  .just.bad{border-color:var(--bad);background:var(--bad-bg)}
  .just strong{display:block;margin-bottom:2px}
  .result{display:none;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
  .result.show{display:block}
  .result h2{margin:0 0 6px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  /* --- filtros y badge de parciales anteriores --- */
  :root{ --warn:#8a6100; --warn-bg:#fff5da; --warn-bd:#e8c765;
         --hot:#b93815;  --hot-bg:#ffe9df;  --hot-bd:#f0a482; }
  @media (prefers-color-scheme:dark){
    :root{ --warn:#e9c46a; --warn-bg:#3a2e10; --warn-bd:#6b5518;
           --hot:#ff9f6e;  --hot-bg:#42200f;  --hot-bd:#7a3b1c; }
  }
  .filters{display:flex;flex-direction:column;gap:9px;margin:0 0 14px}
  .frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .flabel{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    font-weight:700;flex:0 0 auto;margin-right:2px}
  .fbtn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 14px;
    border-radius:999px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;transition:.15s}
  .fbtn:hover{border-color:var(--primary)}
  .fbtn.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .fbtn.sub{font-size:.82rem;padding:6px 12px;font-weight:500}
  .fcheck{display:inline-flex;align-items:center;gap:7px;font-size:.86rem;color:var(--muted);
    cursor:pointer;user-select:none;padding:6px 0}
  .fcheck input{accent-color:var(--primary);width:16px;height:16px;cursor:pointer;margin:0}
  .fcheck.on{color:var(--hot);font-weight:600}
  .scope{font-size:.85rem;color:var(--muted);margin:0 0 10px}
  .exam{display:inline-block;font-size:.72rem;font-weight:700;line-height:1.35;
    padding:3px 10px;border-radius:999px;margin:0 0 8px 6px;
    background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
  .exam.hot{background:var(--hot-bg);color:var(--hot);border-color:var(--hot-bd)}
</style>
</head>
<body>
<header>
  <h1>Negocios Internacionales</h1>
  <p>Práctica de preguntas multiple choice</p>
</header>
<main>
  <nav id="tabs"></nav>
  <div class="filters" id="filters"></div>
  <div class="toolbar">
    <div class="score">Respondidas <b id="answered">0</b>/<b id="total">0</b> · Correctas <b id="right">0</b></div>
    <div class="actions"><button class="btn" id="reset">Reiniciar</button></div>
  </div>
  <div class="scope" id="scope"></div>
  <div class="bar"><i id="progress"></i></div>
  <div id="list"></div>
  <div class="result" id="result"></div>
</main>

<script>
/* ============ DATOS ============
   Para agregar una unidad nueva: sumar un objeto al arreglo UNITS.
   Cada unidad: { id, name, hasGuests, questions:[...] }.
   Cada pregunta: { category, guest, bloque, examHistory, block, q, opts:[...],
                    correct:índice(0=a), why }.
   - category: "clase" | "invitado"; guest: null | "martel" | "oyadomari".
   - bloque: slug del bloque temático (solo Unidad 2); habilita el filtro por bloque.
   - examHistory: { asked, times, temas:[...] } para el badge de parciales. */
const UNITS = [
  {
    id: "u1", name: "Unidad 1", hasGuests: true,
    questions: [
      /* Bloque 1 */
      { category:"clase", guest:null, examHistory:{asked:false, times:0, temas:[]},
        block:"Perfil y preparación",
        q:"¿Cuál describe correctamente el perfil actual del profesional de Negocios Internacionales?",
        opts:["Un especialista en logística y aduana que gestiona las importaciones y exportaciones de una única empresa, con foco en reducir los costos de transporte.",
              "Un estratega global con dominio de idiomas, negociación, análisis de mercados y visión cultural.",
              "Un vendedor de alto rendimiento con foco en cumplir metas de corto plazo y cerrar operaciones al mayor margen posible."],
        correct:1,
        why:"El perfil actual es el de un estratega global: combina idiomas, negociación, análisis de mercados y visión cultural. Las otras opciones describen roles parciales (logística/aduana o vendedor de corto plazo)." },
      { category:"clase", guest:null, examHistory:{asked:false, times:0, temas:[]},
        block:"Perfil y preparación",
        q:"Un desarrollador de negocios internacionales estudia el modelo comercial, los protocolos de contacto y el sistema de compensación de su empresa. ¿Qué pata de su preparación está reforzando?",
        opts:["Habilidades, porque son técnicas de venta y de negociación que se aprenden y se practican en cada reunión con el cliente.",
              "Actitudes, porque definen cómo se posiciona frente a la empresa y frente a los clientes.",
              "Conocimientos, porque se trata de información sobre la empresa, su modelo comercial y su forma de trabajar."],
        correct:2,
        why:"Estudiar el modelo comercial, los protocolos y la compensación es adquirir información sobre la empresa y su forma de trabajar: son Conocimientos." },
      { category:"clase", guest:null, examHistory:{asked:false, times:0, temas:[]},
        block:"Perfil y preparación",
        q:"¿Cuál de las siguientes opciones enumera únicamente HABILIDADES del desarrollador de negocios internacionales?",
        opts:["Negociación, sintonizar–empatizar, creatividad e improvisación, servicio al cliente.",
              "Perseverancia, flexibilidad, tolerancia a la frustración, automotivación, proactividad.",
              "Empresa, estructura, mercado/cartera, productos, competencia, herramientas de trabajo."],
        correct:0,
        why:"Negociación, empatía, creatividad e improvisación y servicio al cliente son habilidades. La opción b lista actitudes y la c lista conocimientos." },
      { category:"clase", guest:null, examHistory:{asked:false, times:0, temas:[]},
        block:"Perfil y preparación",
        q:"¿Qué se aclaró en clase sobre la importancia relativa de las tres patas de la preparación?",
        opts:["Las actitudes son la única pata decisiva, ya que los conocimientos y las habilidades los provee la empresa mediante capacitación interna durante los primeros meses.",
              "Las tres son importantes; conocimientos y habilidades tienen la particularidad de que se pueden ir adquiriendo.",
              "Los conocimientos pesan más que las otras dos, porque las habilidades y las actitudes se desarrollan solas con la experiencia en el rol."],
        correct:1,
        why:"En clase se dijo que las tres patas importan; conocimientos y habilidades tienen la particularidad de que se pueden ir adquiriendo. Las otras opciones declaran una sola pata como decisiva o afirman que las demás se desarrollan solas." },

      { category:"clase", guest:null, examHistory:{asked:true, times:1, temas:["Tema 1"]},
        block:"Perfil y preparación",
        q:"¿Qué es un Desarrollador de Negocios Internacionales?",
        opts:["Es un profesional de administración que vende productos o servicios a nivel global.",
              "Es una persona que a través de su comportamiento y acción logra que otras personas a lo largo del mundo hagan algo que no harían espontáneamente.",
              "Es una persona que comercializa bienes y servicios en el mundo a comisión."],
        correct:1,
        why:"Es la definición textual usada en la cátedra. Las otras dos son distractores típicos de parcial: reducen el rol a \"vendedor\" o a \"comisionista\"." },
      /* Bloque 2 */
      { category:"clase", guest:null, examHistory:{asked:false, times:0, temas:[]},
        block:"Ciclo de desarrollo de negocios",
        q:"¿Para qué sirve la etapa de Contacto del ciclo de desarrollo de negocios internacionales?",
        opts:["Para establecer la doble correspondencia entre la solución ofrecida y el problema específico del prospecto.",
              "Para obtener el organigrama de la empresa y comprender su proceso decisorio de compra.",
              "Para conocer los roles involucrados y saber con quiénes se deberá relacionar en el futuro."],
        correct:2,
        why:"Contacto sirve para conocer los roles involucrados y saber con quiénes habrá que relacionarse. La opción a corresponde a Investigación (doble correspondencia) y la b a Calificación (organigrama y proceso decisorio)." },
      { category:"clase", guest:null, examHistory:{asked:false, times:0, temas:[]},
        block:"Ciclo de desarrollo de negocios",
        q:"Un desarrollador averigua si el proyecto del prospecto existe realmente, si tiene fondos asignados, en qué plazos quiere comprar e implementar y quién tiene la autoridad de compra. ¿En qué etapa del ciclo está?",
        opts:["Contacto, porque interactúa personalmente con uno de los roles del prospecto.",
              "Calificación, porque valida la existencia del proyecto, los fondos, los tiempos y la autoridad de compra.",
              "Investigación, porque identifica la oportunidad y quiénes más están cotizando."],
        correct:1,
        why:"Validar proyecto, fondos, plazos y autoridad de compra es lo que se hace en Calificación. Contacto es solo la primera interacción con un rol, e Investigación busca entender la necesidad real y quiénes más están cotizando." },
      { category:"clase", guest:null, examHistory:{asked:false, times:0, temas:[]},
        block:"Ciclo de desarrollo de negocios",
        q:"En la etapa de Investigación se establece la \"doble correspondencia\". ¿Cuál es?",
        opts:["De la solución ofrecida con el problema específico, y de la empresa proveedora con la empresa cliente.",
              "Del precio ofrecido con el presupuesto del prospecto, y del plazo de entrega con el plazo de implementación.",
              "De las necesidades operacionales de la empresa con las motivaciones personales de cada uno de sus roles."],
        correct:0,
        why:"La doble correspondencia es entre la solución y el problema específico del prospecto, y entre la empresa proveedora y la empresa cliente." },
      { category:"clase", guest:null, examHistory:{asked:false, times:0, temas:[]},
        block:"Ciclo de desarrollo de negocios",
        q:"Tras la presentación, el prospecto responde \"necesito pensarlo\" sin dar más explicaciones. ¿Cómo se clasifica esta objeción y cómo conviene manejarla?",
        opts:["Real: es una limitación de la solución, por lo que hay que ser honesto y discutir alternativas.",
              "Ficticia: es una afirmación vaga, por lo que hay que profundizar para entender sus verdaderas preocupaciones.",
              "Real: es un error de percepción, por lo que hay que dar información adicional y aclarar el malentendido."],
        correct:1,
        why:"Las objeciones ficticias son excusas o afirmaciones vagas para evitar decidir; ante \"necesito pensarlo\" hay que profundizar para entender sus verdaderas preocupaciones. Las reales (limitaciones de la solución, errores de percepción) se manejan con honestidad e información adicional." },
      { category:"clase", guest:null, examHistory:{asked:false, times:0, temas:[]},
        block:"Ciclo de desarrollo de negocios",
        q:"¿Cuál de las siguientes afirmaciones sobre el Cierre es correcta?",
        opts:["Una vez presentada la propuesta técnico-económica el cierre es automático, por lo que el vendedor no necesita pedir la orden de compra.",
              "En la venta de soluciones alcanza con un único ciclo de venta para llegar al cierre, siempre que el prospecto haya reconocido su necesidad.",
              "Se logra si los pasos anteriores estuvieron bien hechos y exige equilibrio entre imponerlo y esperarlo con cierta pasividad."],
        correct:2,
        why:"El cierre es consecuencia de haber hecho bien los pasos previos, y requiere equilibrio: ni forzarlo ni esperarlo pasivamente. No es automático y no alcanza con un único ciclo." },

      { category:"clase", guest:null, examHistory:{asked:true, times:2, temas:["Tema 2","Tema 4"]},
        block:"Ciclo de desarrollo de negocios",
        q:"¿Cuál es el Ciclo de Desarrollo de Negocios Internacionales?",
        opts:["Presentación y Manejo de Objeciones - Contacto - Calificación - Investigación - Cierre.",
              "Contacto - Calificación - Investigación - Presentación y Manejo de Objeciones - Cierre.",
              "Contacto - Presentación y Manejo de Objeciones - Investigación - Calificación - Cierre."],
        correct:1,
        why:"Apareció igual en Tema 2 y Tema 4. Es puro orden memorístico: Contacto → Calificación → Investigación → Presentación y Manejo de Objeciones → Cierre." },
      { category:"clase", guest:null, examHistory:{asked:true, times:2, temas:["Tema 2","Tema 4"]},
        block:"Ciclo de desarrollo de negocios",
        q:"Un desarrollador ya validó fondos y autoridad de compra del prospecto, y ahora necesita establecer la doble correspondencia entre su solución y el problema del cliente. ¿Qué etapa viene DESPUÉS de esa?",
        opts:["Contacto.",
              "Presentación y Manejo de Objeciones.",
              "Cierre directo, sin pasos intermedios."],
        correct:1,
        why:"Calificación (fondos/autoridad) → Investigación (doble correspondencia, lo que ya hizo) → sigue Presentación y Manejo de Objeciones. Sirve para practicar el orden en formato de caso, no solo de memoria." },
      /* Bloque 3 */
      { category:"clase", guest:null, examHistory:{asked:false, times:0, temas:[]},
        block:"Logística del comercial y funnel",
        q:"¿Qué es la logística del vendedor / desarrollador de negocios internacionales?",
        opts:["Las actividades que realiza cuando no está frente al cliente, que suelen subestimarse aunque son decisivas para su éxito.",
              "Las tareas de transporte, almacenaje y entrega física de la mercadería que vende a sus clientes en el exterior, incluyendo la documentación de embarque.",
              "El seguimiento que hace después de la venta, una vez que el cliente ya recibió la orden de compra."],
        correct:0,
        why:"La logística del comercial son las actividades fuera de la interacción con el cliente (preparación, seguimiento, registro, etc.), subestimadas pero decisivas. No se refiere a la logística física de mercadería." },
      { category:"clase", guest:null, examHistory:{asked:false, times:0, temas:[]},
        block:"Logística del comercial y funnel",
        q:"¿Qué dos etapas tiene el funnel que NO forman parte del ciclo de desarrollo de cinco pasos?",
        opts:["Prospección y Presentación","Investigación y Post venta","Prospección y Post venta"],
        correct:2,
        why:"El funnel agrega Prospección (al inicio) y Post venta (al final) al ciclo de cinco pasos. Presentación e Investigación ya son parte del ciclo." },
      { category:"clase", guest:null, examHistory:{asked:false, times:0, temas:[]},
        block:"Logística del comercial y funnel",
        q:"Un director comercial actualiza su funnel todas las semanas, pero en dos meses ninguna oportunidad cambió de etapa. ¿Qué principio del funnel está pasando por alto?",
        opts:["El funnel debe hacer progresar los proyectos de forma proactiva, ya que el mero transcurrir del tiempo no modifica su composición.",
              "El funnel debe actualizarse cada semana, porque la periodicidad por sí sola hace que las oportunidades avancen de etapa.",
              "El funnel debe incluir una sola oportunidad por cuenta, para que el avance de cada prospecto pueda medirse con claridad."],
        correct:0,
        why:"Actualizar el funnel no basta: hay que hacer avanzar los proyectos activamente. El paso del tiempo por sí solo no cambia su composición." },
      { category:"clase", guest:null, examHistory:{asked:false, times:0, temas:[]},
        block:"Logística del comercial y funnel",
        q:"¿Cuál describe correctamente la \"lista corta\" del funnel?",
        opts:["Personas o empresas que podrían estar interesadas pero con las que aún no hubo interacción directa; es el punto de partida.",
              "Prospectos que ya concretaron una compra y se convirtieron en clientes, que son el resultado final del funnel tras recorrer sus etapas.",
              "Prospectos que pasaron por calificación e investigación y muestran un interés concreto, por lo que ahí se concentran los esfuerzos de cierre."],
        correct:2,
        why:"La lista corta reúne a los prospectos que ya pasaron por calificación e investigación y muestran un interés concreto, por lo que ahí se concentran los esfuerzos de cierre. La opción a describe a los potenciales (todavía sin interacción directa, punto de partida de la prospección) y la b a los clientes (prospectos que ya compraron)." },
      { category:"clase", guest:null, examHistory:{asked:false, times:0, temas:[]},
        block:"Logística del comercial y funnel",
        q:"¿Cuál es una ventaja del funnel para el GERENTE (y no para el vendedor)?",
        opts:["Aumentar su credibilidad interna frente a la dirección y frente al resto de las áreas de la compañía.",
              "Evitar el drenaje de recursos escasos de la compañía en oportunidades que no cierran.",
              "Seleccionar las tareas más productivas entre todas las oportunidades que tiene abiertas."],
        correct:1,
        why:"Evitar que se drenen recursos escasos de la compañía en oportunidades que no cierran es una ventaja propia del gerente. Las otras dos benefician al vendedor." },

      { category:"clase", guest:null, examHistory:{asked:true, times:1, temas:["Tema 1"]},
        block:"Logística del comercial y funnel",
        q:"¿Qué es un Funnel?",
        opts:["El funnel es la herramienta que explica la situación futura de las oportunidades comerciales.",
              "El funnel es el barómetro que explica la situación presente y marca el camino para la actividad comercial futura.",
              "El funnel es el termómetro de las futuras oportunidades comerciales al momento del cierre."],
        correct:1,
        why:"\"Barómetro que explica la situación presente\" es la definición exacta de la diapositiva. Las variantes tramposas (\"termómetro\", \"situación futura\") cambian la esencia del concepto: el funnel mide el presente, no predice el futuro." },
      { category:"clase", guest:null, examHistory:{asked:true, times:2, temas:["Tema 2","Tema 4"]},
        block:"Logística del comercial y funnel",
        q:"¿Cuáles son las Ventajas para el Vendedor de utilizar un Funnel?",
        opts:["Selección de Tareas Futuras - Foco - Herramienta para hablar con sus Pares - Selección de tareas más productivas.",
              "Foco - Herramienta para hablar con su Jefe - Selección de tareas más productivas - Mejora de organización de su trabajo de Ventas.",
              "Foco - Herramienta para hablar con sus Pares - Selección de tareas rutinarias - Mejora de organización de su trabajo de Ventas y prospección."],
        correct:1,
        why:"Apareció igual en Tema 2 y Tema 4: altísima probabilidad de repetirse. Las trampas están en \"Jefe\" (correcto) vs \"Pares\" (incorrecto) y \"tareas más productivas\" (correcto) vs \"tareas futuras/rutinarias\" (incorrecto)." },
      { category:"clase", guest:null, examHistory:{asked:true, times:2, temas:["Tema 2","Tema 4"]},
        block:"Logística del comercial y funnel",
        q:"Según lo visto en clase, ¿cuál de las siguientes NO es una ventaja del Funnel para el vendedor?",
        opts:["Le permite evitar el drenaje de recursos escasos de la compañía en oportunidades que no cierran.",
              "Le ayuda a tener foco.",
              "Le permite aumentar su credibilidad interna."],
        correct:0,
        why:"\"Evitar el drenaje de recursos escasos\" es una ventaja para el GERENTE, no para el vendedor. Esta variante cruza el tema repetido de parciales con la distinción vendedor/gerente, que también se toma." },
      /* Bloque 4 */
      { category:"clase", guest:null, examHistory:{asked:false, times:0, temas:[]},
        block:"Seguimiento, account management y planning",
        q:"Un gerente de compras quiere ascender y ganar visibilidad dentro de la empresa. Según la estrategia en la cuenta, esa motivación personal determina principalmente:",
        opts:["Qué vendo, porque las motivaciones personales definen la solución técnica que se propone.",
              "Cómo lo vendo, porque las motivaciones e inquietudes personales dictan el enfoque con ese rol.",
              "Qué vendo y cómo lo vendo, porque necesidades y motivaciones son iguales para todos los roles."],
        correct:1,

/* ============ LÓGICA ============ */
const $ = id => document.getElementById(id);
const LETTERS = "abcdefghij";
const INTEG = "integradora";
let current = UNITS[0].id;
let state = {};          // estado por pestaña: { items:[...], answers:{key:opcion} }
let filterCat = "all";    // all | clase | invitado | martel | oyadomari
let filterBloque = "all"; // slug de bloque temático (Unidad 2) o "all"
let onlyExam = false;     // true = solo preguntas tomadas en parciales anteriores

/* Red de seguridad: garantiza los campos de filtrado en toda pregunta,
   incluso si más adelante se carga una sin ellos. */
UNITS.forEach(u => u.questions.forEach(q => {
  if (!q.category) q.category = "clase";
  if (!("guest" in q)) q.guest = null;
  if (!("bloque" in q)) q.bloque = null;
  if (!q.examHistory) q.examHistory = { asked:false };
  if (q.examHistory.times == null) q.examHistory.times = q.examHistory.asked ? 1 : 0;
  if (!Array.isArray(q.examHistory.temas)) q.examHistory.temas = [];
}));

const FILTERS = [
  ["all",       "Todas",          false],
  ["clase",     "Temas de clase", false],
  ["invitado",  "Invitados",      false],
  ["martel",    "Martel",         true],
  ["oyadomari", "Oyadomari",      true]
];
const BLOQUES = {
  distribucion_transporte: "Distribución y transporte",
  comunicacion_marca_pais: "Comunicación y marca país",
  formas_entrada:          "Formas de entrada",
  desarrollo_productos:    "Desarrollo de productos",
  precios_internacionales: "Precios internacionales",
  analisis_pais:           "Exportar y análisis de país"
};
const SCOPE_NAME = {
  all:"Todas", clase:"Temas de clase", invitado:"Invitados",
  martel:"Invitado: Martel", oyadomari:"Invitado: Oyadomari"
};

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* Qué controles aplican a la pestaña activa: se deduce de los datos, no se hardcodea la unidad. */
function tabUnits(){ return current === INTEG ? UNITS : UNITS.filter(u => u.id === current); }
function hasGuests(){ return tabUnits().some(u => u.hasGuests); }
function bloquesFor(){
  if (current === INTEG) return [];   // la integradora mezcla unidades: sin filtro de bloque
  const out = [];
  tabUnits().forEach(u => u.questions.forEach(q => {
    if (q.bloque && !out.includes(q.bloque)) out.push(q.bloque);
  }));
  return out;
}
function bloqueName(b){ return BLOQUES[b] || b; }
/* etiqueta corta para el tag de cada tarjeta */
function shortScope(){
  if (filterBloque !== "all") return bloqueName(filterBloque);
  return hasGuests() ? SCOPE_NAME[filterCat] : "Todas";
}
/* etiqueta completa para la línea de alcance y el resultado */
function scopeLabel(){
  const p = [hasGuests() ? SCOPE_NAME[filterCat] : "Todas"];
  if (filterBloque !== "all") p.push(bloqueName(filterBloque));
  if (onlyExam) p.push("solo tomadas en parciales anteriores");
  return p.join(" · ");
}

function matches(it){
  if (onlyExam && !it.examHistory.asked) return false;
  if (filterBloque !== "all" && it.bloque !== filterBloque) return false;
  if (filterCat === "clase")     return it.category === "clase";
  if (filterCat === "invitado")  return it.category === "invitado";
  if (filterCat === "martel")    return it.guest === "martel";
  if (filterCat === "oyadomari") return it.guest === "oyadomari";
  return true;
}

function itemsFor(tab){
  /* key estable: las respuestas no dependen de la posición en la lista filtrada */
  const tag = (u,q,i) => ({...q, unit:u.name, key:u.id+"#"+i});
  if (tab === INTEG)
    return shuffle(UNITS.flatMap(u => u.questions.map((q,i) => tag(u,q,i))));
  const u = UNITS.find(u => u.id === tab);
  return u.questions.map((q,i) => tag(u,q,i));
}
function ensure(tab){ if(!state[tab]) state[tab] = { items:itemsFor(tab), answers:{} }; return state[tab]; }
function visible(){ return ensure(current).items.filter(matches); }

function renderTabs(){
  $("tabs").innerHTML = "";
  [...UNITS.map(u=>[u.id,u.name]), [INTEG,"🔀 Prueba Integradora"]].forEach(([id,name])=>{
    const b = document.createElement("button");
    b.textContent = name;
    b.className = id===current ? "active" : "";
    b.onclick = () => {
      current = id;
      filterBloque = "all";                 // los bloques son propios de cada unidad
      if (!hasGuests()) filterCat = "all";  // sin invitados, el filtro de categoría no aplica
      renderTabs(); renderFilters(); render();
      window.scrollTo({top:0,behavior:"smooth"});
    };
    $("tabs").appendChild(b);
  });
}

function renderFilters(){
  const box = $("filters");
  box.innerHTML = "";

  /* una fila de chips; `pick` aplica el valor elegido y repinta */
  const chipRow = (label, opciones, activo, pick) => {
    const row = document.createElement("div");
    row.className = "frow";
    if (label){
      const s = document.createElement("span");
      s.className = "flabel"; s.textContent = label;
      row.appendChild(s);
    }
    opciones.forEach(([id,name,sub])=>{
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = sub ? "· " + name : name;
      b.className = "fbtn" + (sub ? " sub" : "") + (id===activo ? " active" : "");
      b.onclick = () => { pick(id); renderFilters(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
      row.appendChild(b);
    });
    box.appendChild(row);
  };

  /* categoría e invitados: solo si la unidad activa tiene invitados */
  if (hasGuests())
    chipRow("", FILTERS, filterCat, id => { filterCat = id; });

  /* bloque temático: solo en unidades que traen el campo `bloque` */
  const bl = bloquesFor();
  if (bl.length)
    chipRow("Bloque", [["all","Todos",false]].concat(bl.map(b => [b, bloqueName(b), true])),
            filterBloque, id => { filterBloque = id; });

  const row = document.createElement("div");
  row.className = "frow";
  const lab = document.createElement("label");
  lab.className = "fcheck" + (onlyExam ? " on" : "");
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.checked = onlyExam;
  cb.onchange = () => { onlyExam = cb.checked; renderFilters(); render(); };
  lab.appendChild(cb);
  lab.appendChild(document.createTextNode("📌 Solo tomadas en parciales anteriores"));
  row.appendChild(lab);
  box.appendChild(row);
}

function examBadge(it){
  const e = it.examHistory;
  if (!e.asked) return "";
  const hot = e.times >= 2;
  const temas = e.temas.length ? " · " + e.temas.join(", ") : "";
  const title = hot ? "Tema repetido en parciales: alta probabilidad de que vuelva a salir"
                    : "Ya fue tomada en un parcial anterior";
  return `<span class="exam${hot?" hot":""}" title="${title}">📌 Tomada en parciales anteriores (x${e.times})${temas}</span>`;
}

function render(){
  const s = ensure(current), list = $("list"), items = visible(), n = items.length;
  list.innerHTML = "";
  $("result").className = "result";
  if(!n){
    list.innerHTML = '<div class="empty">No hay preguntas que cumplan con este filtro.</div>';
    updateStats(); return;
  }

  let lastBlock = null;
  items.forEach((it, i) => {
    if (current !== INTEG && it.block !== lastBlock){
      lastBlock = it.block;
      const h = document.createElement("div");
      h.className = "block-title"; h.textContent = it.block;
      list.appendChild(h);
    }
    const card = document.createElement("section");
    card.className = "q";
    const tag = current===INTEG
      ? `${it.unit} · Pregunta ${i+1} de ${n}`
      : `Pregunta ${i+1} de ${n} (${shortScope()})`;
    card.innerHTML = `<span class="tag">${tag}</span>${examBadge(it)}<h3>${i+1}. ${it.q}</h3><div class="opts"></div>`;
    const box = card.querySelector(".opts");
    it.opts.forEach((txt, k) => {
      const b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      b.innerHTML = `<span class="l">${LETTERS[k]}</span><span>${txt}</span>`;
      b.onclick = () => answer(it.key, k);
      box.appendChild(b);
    });
    list.appendChild(card);
    if (s.answers[it.key] !== undefined) paint(card, it, s.answers[it.key]);
  });
  updateStats();
}

function paint(card, it, choice){
  const btns = card.querySelectorAll(".opt");
  btns.forEach((b,k)=>{
    b.disabled = true;
    if (k === it.correct) b.classList.add("correct");
    else if (k === choice) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const ok = choice === it.correct;
  if (!card.querySelector(".just")){
    const d = document.createElement("div");
    d.className = "just" + (ok ? "" : " bad");
    d.innerHTML = `<strong>${ok ? "✅ ¡Correcto!" : "❌ Incorrecto — la respuesta correcta es la "+LETTERS[it.correct]+")"}</strong>${it.why}`;
    card.appendChild(d);
  }
}

function answer(key, k){
  const s = ensure(current);
  if (s.answers[key] !== undefined) return;
  s.answers[key] = k;
  const items = visible(), i = items.findIndex(it => it.key === key);
  if (i >= 0) paint($("list").querySelectorAll(".q")[i], items[i], k);
  updateStats();
}

function updateStats(){
  /* el puntaje se calcula siempre sobre el subconjunto filtrado */
  const s = ensure(current), items = visible(), total = items.length;
  let done = 0, right = 0;
  items.forEach(it => {
    const a = s.answers[it.key];
    if (a !== undefined){ done++; if (a === it.correct) right++; }
  });
  $("total").textContent = total; $("answered").textContent = done; $("right").textContent = right;
  $("progress").style.width = total ? (done/total*100)+"%" : "0";
  $("scope").textContent = `Mostrando ${total} pregunta${total===1?"":"s"} · ${scopeLabel()}`;
  const r = $("result");
  if (total && done === total){
    const pct = Math.round(right/total*100);
    r.innerHTML = `<h2>${pct >= 60 ? "🎉" : "💪"} Resultado: ${right}/${total} (${pct}%)</h2><p>${scopeLabel()} — ${pct>=60 ? "¡Buen trabajo!" : "Repasá las justificaciones e intentá de nuevo."}</p>`;
    r.className = "result show";
  } else r.className = "result";
}

$("reset").onclick = () => { delete state[current]; render(); window.scrollTo({top:0,behavior:"smooth"}); };

renderTabs(); renderFilters(); render();
</script>
</body>
</html>
