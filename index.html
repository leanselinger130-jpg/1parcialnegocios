<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Negocios Internacionales – Práctica</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#5b6478; --border:#dfe4ee;
    --primary:#3b5bdb; --primary-soft:#e7ecff;
    --ok:#1f9d55; --ok-bg:#e6f6ec; --bad:#d64545; --bad-bg:#fdeaea;
    --shadow:0 2px 10px rgba(20,30,60,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#10141f; --card:#1a2030; --text:#e8ecf5; --muted:#9aa4bb; --border:#2b3350;
      --primary:#7b93ff; --primary-soft:#232b4a;
      --ok:#4cc38a; --ok-bg:#15301f; --bad:#ff7b7b; --bad-bg:#3a1c1f;
      --shadow:none;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  header{padding:28px 16px 8px;text-align:center}
  header h1{margin:0;font-size:clamp(1.3rem,4vw,1.9rem)}
  header p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
  main{max-width:820px;margin:0 auto;padding:0 16px 48px}

  nav{display:flex;gap:8px;overflow-x:auto;padding:16px 0;scrollbar-width:thin}
  nav button{flex:0 0 auto;border:1px solid var(--border);background:var(--card);color:var(--text);
    padding:10px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
  nav button:hover{border-color:var(--primary)}
  nav button.active{background:var(--primary);border-color:var(--primary);color:#fff}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
  .score{font-weight:600;color:var(--muted)}
  .score b{color:var(--text)}
  .actions{display:flex;gap:8px}
  .btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 14px;
    border-radius:8px;font:inherit;cursor:pointer}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .bar{height:6px;background:var(--border);border-radius:9px;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}

  .block-title{margin:26px 0 10px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);font-weight:700}
  .q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
  .q h3{margin:0 0 4px;font-size:1.02rem}
  .tag{display:inline-block;font-size:.72rem;background:var(--primary-soft);color:var(--primary);
    padding:2px 9px;border-radius:999px;margin-bottom:8px;font-weight:600}
  .opts{display:grid;gap:10px;margin-top:12px}
  .opt{display:flex;gap:12px;text-align:left;width:100%;border:2px solid var(--border);background:transparent;
    color:var(--text);padding:12px 14px;border-radius:10px;font:inherit;cursor:pointer;transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
  .opt .l{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
    display:grid;place-items:center;font-weight:700;font-size:.85rem}
  .opt:disabled{cursor:default}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .l{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .l{background:var(--bad);color:#fff}
  .opt.dim{opacity:.6}
  .just{margin-top:14px;padding:12px 14px;border-radius:10px;border-left:4px solid var(--ok);background:var(--ok-bg);font-size:.95rem}
  .just.bad{border-color:var(--bad);background:var(--bad-bg)}
  .just strong{display:block;margin-bottom:2px}
  .result{display:none;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
  .result.show{display:block}
  .result h2{margin:0 0 6px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>Negocios Internacionales</h1>
  <p>Práctica de preguntas multiple choice</p>
</header>
<main>
  <nav id="tabs"></nav>
  <div class="toolbar">
    <div class="score">Respondidas <b id="answered">0</b>/<b id="total">0</b> · Correctas <b id="right">0</b></div>
    <div class="actions"><button class="btn" id="reset">Reiniciar</button></div>
  </div>
  <div class="bar"><i id="progress"></i></div>
  <div id="list"></div>
  <div class="result" id="result"></div>
</main>

<script>
/* ============ DATOS ============
   Para agregar una unidad nueva: sumar un objeto al arreglo UNITS.
   Cada pregunta: { block, q, opts:[...], correct:índice(0=a), why } */
const UNITS = [
  {
    id: "u1", name: "Unidad 1",

      /* Bloque 1 */

              "Un estratega global con dominio de idiomas, negociación, análisis de mercados y visión cultural.",
              "Un vendedor de alto rendimiento con foco en cumplir metas de corto plazo y cerrar operaciones al mayor margen posible."],
        correct:1,
        why:"El perfil actual es el de un estratega global: combina idiomas, negociación, análisis de mercados y visión cultural. Las otras opciones describen roles parciales (logística/aduana o vendedor de corto plazo)." },
      { block:"Perfil y preparación",
        q:"Un desarrollador de negocios internacionales estudia el modelo comercial, los protocolos de contacto y el sistema de compensación de su empresa. ¿Qué pata de su preparación está reforzando?",
        opts:["Habilidades, porque son técnicas de venta y de negociación que se aprenden y se practican en cada reunión con el cliente.",

              "Conocimientos, porque se trata de información sobre la empresa, su modelo comercial y su forma de trabajar."],
        correct:2,
        why:"Estudiar el modelo comercial, los protocolos y la compensación es adquirir información sobre la empresa y su forma de trabajar: son Conocimientos." },
      { block:"Perfil y preparación",

        opts:["Negociación, sintonizar–empatizar, creatividad e improvisación, servicio al cliente.",
              "Perseverancia, flexibilidad, tolerancia a la frustración, automotivación, proactividad.",
              "Empresa, estructura, mercado/cartera, productos, competencia, herramientas de trabajo."],
        correct:0,
        why:"Negociación, empatía, creatividad e improvisación y servicio al cliente son habilidades. La opción b lista actitudes y la c lista conocimientos." },
      { block:"Perfil y preparación",

              "Las tres son importantes; conocimientos y habilidades tienen la particularidad de que se pueden ir adquiriendo.",

/* ============ LÓGICA ============ */
const $ = id => document.getElementById(id);
const LETTERS = "abcdefghij";
const INTEG = "integradora";
let current = UNITS[0].id;
let state = {};   // estado por pestaña: { items:[...], answers:{idx:opcion} }

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function itemsFor(tab){
  if (tab === INTEG)
    return shuffle(UNITS.flatMap(u => u.questions.map(q => ({...q, unit:u.name}))));
  const u = UNITS.find(u => u.id === tab);
  return u.questions.map(q => ({...q, unit:u.name}));
}
function ensure(tab){ if(!state[tab]) state[tab] = { items:itemsFor(tab), answers:{} }; return state[tab]; }

function renderTabs(){
  $("tabs").innerHTML = "";
  [...UNITS.map(u=>[u.id,u.name]), [INTEG,"🔀 Prueba Integradora"]].forEach(([id,name])=>{
    const b = document.createElement("button");
    b.textContent = name;
    b.className = id===current ? "active" : "";
    b.onclick = () => { current = id; renderTabs(); render(); };
    $("tabs").appendChild(b);
  });
}

function render(){
  const s = ensure(current), list = $("list");
  list.innerHTML = "";
  $("result").className = "result";
  if(!s.items.length){ list.innerHTML = '<div class="empty">Todavía no hay preguntas cargadas.</div>'; updateStats(); return; }

  let lastBlock = null;
  s.items.forEach((it, i) => {
    if (current !== INTEG && it.block !== lastBlock){
      lastBlock = it.block;
      const h = document.createElement("div");
      h.className = "block-title"; h.textContent = it.block;
      list.appendChild(h);
    }
    const card = document.createElement("section");
    card.className = "q";
    card.innerHTML = `<span class="tag">${current===INTEG ? it.unit : "Pregunta "+(i+1)}</span><h3>${current===INTEG ? (i+1)+". " : (i+1)+". "}${it.q}</h3><div class="opts"></div>`;
    const box = card.querySelector(".opts");
    it.opts.forEach((txt, k) => {
      const b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      b.innerHTML = `<span class="l">${LETTERS[k]}</span><span>${txt}</span>`;
      b.onclick = () => answer(i, k);
      box.appendChild(b);
    });
    list.appendChild(card);
    if (s.answers[i] !== undefined) paint(card, it, s.answers[i]);
  });
  updateStats();
}

function paint(card, it, choice){
  const btns = card.querySelectorAll(".opt");
  btns.forEach((b,k)=>{
    b.disabled = true;
    if (k === it.correct) b.classList.add("correct");
    else if (k === choice) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const ok = choice === it.correct;
  if (!card.querySelector(".just")){
    const d = document.createElement("div");
    d.className = "just" + (ok ? "" : " bad");
    d.innerHTML = `<strong>${ok ? "✅ ¡Correcto!" : "❌ Incorrecto — la respuesta correcta es la "+LETTERS[it.correct]+")"}</strong>${it.why}`;
    card.appendChild(d);
  }
}

function answer(i, k){
  const s = ensure(current);
  if (s.answers[i] !== undefined) return;
  s.answers[i] = k;
  paint($("list").querySelectorAll(".q")[i], s.items[i], k);
  updateStats();
}

function updateStats(){
  const s = ensure(current), total = s.items.length;
  const done = Object.keys(s.answers).length;
  const right = Object.entries(s.answers).filter(([i,k]) => s.items[i].correct === k).length;
  $("total").textContent = total; $("answered").textContent = done; $("right").textContent = right;
  $("progress").style.width = total ? (done/total*100)+"%" : "0";
  const r = $("result");
  if (total && done === total){
    const pct = Math.round(right/total*100);
    r.innerHTML = `<h2>${pct >= 60 ? "🎉" : "💪"} Resultado: ${right}/${total} (${pct}%)</h2><p>${pct>=60 ? "¡Buen trabajo!" : "Repasá las justificaciones e intentá de nuevo."}</p>`;
    r.className = "result show";
  } else r.className = "result";
}

$("reset").onclick = () => { delete state[current]; render(); window.scrollTo({top:0,behavior:"smooth"}); };

renderTabs(); render();
</script>
</body>
</html>
